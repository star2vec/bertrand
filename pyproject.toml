[project]
name = "pilot"
version = "0.1.0"
description = "Bertrand pilot: read and steer a small model's choice of approach"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch>=2.5",
  "transformers>=4.45,<5",
  "accelerate>=1.0",
  "scikit-learn>=1.5",
  "numpy>=1.26",
  "pandas>=2.2",
  "tqdm>=4.66",
  "scipy>=1.11",
  # 4-bit loading of the 7B on the Windows GPU; no MPS build, so Windows only
  "bitsandbytes>=0.45; sys_platform == 'win32'",
  "matplotlib>=3.11.2",
]

[tool.uv]
package = false

# Windows (the RTX laptop) takes CUDA torch from the PyTorch index; macOS takes PyPI torch (MPS).
[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
